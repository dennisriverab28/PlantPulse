<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PlantPulse — Engineering Operations Hub">
  <defs>
    <linearGradient id="pulse-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <style>
      .trace {
        fill: none;
        stroke: url(#pulse-grad);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1600;
        stroke-dashoffset: 1600;
        animation: draw 6s linear infinite;
      }
      .trace-glow {
        fill: none;
        stroke: #34d399;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.12;
        stroke-dasharray: 1600;
        stroke-dashoffset: 1600;
        animation: draw 6s linear infinite;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .beacon { animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" fill="none" stroke="#27272a"/>

  <circle class="beacon" cx="1148" cy="42" r="6" fill="#34d399"/>
  <text class="sans" x="1132" y="47" text-anchor="end" font-size="14" fill="#71717a">live</text>

  <text class="sans" x="600" y="138" text-anchor="middle" font-size="68" font-weight="700" fill="#fafafa" letter-spacing="-1">Plant<tspan fill="#34d399">Pulse</tspan></text>
  <text class="sans" x="600" y="180" text-anchor="middle" font-size="21" fill="#a1a1aa">Embedded Fleet Operations Hub — device telemetry · firmware validation · lab inventory · AI copilot</text>

  <path class="trace-glow" d="M -10 245 H 150 l 12 -16 12 16 H 280 l 11 -52 14 82 10 -30 H 478 l 12 -16 12 16 H 622 l 11 -64 14 98 10 -34 H 838 l 12 -16 12 16 H 980 l 11 -48 14 76 10 -28 H 1210"/>
  <path class="trace" d="M -10 245 H 150 l 12 -16 12 16 H 280 l 11 -52 14 82 10 -30 H 478 l 12 -16 12 16 H 622 l 11 -64 14 98 10 -34 H 838 l 12 -16 12 16 H 980 l 11 -48 14 76 10 -28 H 1210"/>
</svg>
